<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./src/style.css">
  <title>Excalibur + Vite</title>
</head>

<body>
  <script type="module" src="./src/main.ts"></script>
  <div id="ui-overlay">
    <div class="button-bar">
      <button class="game-button" id="move-camera-left" aria-label="Move camera left">←</button>
      <button class="game-button" id="move-camera-right" aria-label="Move camera right">→</button>
      <button class="game-button" id="cancel-building" aria-label="Cancel building">X</button>
      <button class="game-button" id="place-barricade" aria-label="Place barricade">Barricade</button>
      <button class="game-button" id="place-farm" aria-label="Place farm">Farm</button>

    </div>
    <div class="button-bar">
      <button class="game-button" id="zoom-in" aria-label="Zoom in">+</button>
      <button class="game-button" id="zoom-out" aria-label="Zoom out">-</button>
    </div>

    <div class="button-bar">
    <div id="food-counter">Food: 0/0</div>

    </div>
  </div>
</body>

</html>
